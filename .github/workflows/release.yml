name: release

# Chạy khi bạn push một tag dạng v* (ví dụ: v0.1.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write # cần quyền này để tạo Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # macOS: build universal (Apple Silicon + Intel)
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest' # Windows: .msi + .exe
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend deps
        run: npm install

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Personae ${{ github.ref_name }}'
          releaseBody: 'Tải file cài đặt bên dưới. macOS (Apple Silicon/Intel) và Windows.'
          releaseDraft: true   # tạo bản nháp để bạn kiểm tra trước khi Publish
          prerelease: false
          args: ${{ matrix.args }}
