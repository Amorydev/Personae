name: release

# Chạy khi bạn push một tag dạng v* (ví dụ: v0.1.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # macOS: build universal (Apple Silicon + Intel)
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest' # Windows: .msi + .exe
            args: ''

    runs-on: ${{ matrix.platform }}
    # Dùng để bỏ qua bước upload VPS khi chưa cấu hình secrets (build vẫn xanh).
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend deps
        run: npm install

      - name: Build app (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      # Lưu file cài đặt làm artifact — tải trực tiếp từ trang Actions để test,
      # không phụ thuộc bước upload VPS bên dưới (chạy kể cả khi VPS lỗi).
      - name: Upload build artifact (for testing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personae-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: ignore

      # Upload file cài đặt lên VPS qua SSH (nguồn tải công khai, KHÔNG lộ GitHub).
      # Repo để private — người dùng tải qua https://claudemux.com/dl/latest/...
      - name: Upload installers to VPS
        if: ${{ env.VPS_HOST != '' }}
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}   # vd: /var/www/claudemux/dl
          VPS_PORT: ${{ secrets.VPS_PORT }}   # tùy chọn, mặc định 22
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            SRC=$(find src-tauri/target -type f -name '*.dmg' | head -n1)
            STABLE_NAME="Personae-macOS.dmg"
          else
            SRC=$(find src-tauri/target -type f -name '*-setup.exe' | head -n1)
            STABLE_NAME="Personae-Windows-setup.exe"
          fi
          if [ -z "${SRC:-}" ] || [ ! -f "$SRC" ]; then
            echo "::error::Không tìm thấy file cài đặt để upload"; exit 1
          fi
          BASE=$(basename "$SRC")
          PORT="${VPS_PORT:-22}"

          # Ghi private key ra file tạm (khử CRLF — nguyên nhân phổ biến của
          # "invalid format"), rồi kiểm tra key hợp lệ trước khi dùng.
          KEY="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$KEY"
          chmod 600 "$KEY"
          if ! ssh-keygen -y -f "$KEY" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY không phải OpenSSH private key hợp lệ. Dán TRỌN private key (từ '-----BEGIN OPENSSH PRIVATE KEY-----' đến '-----END OPENSSH PRIVATE KEY-----'), KHÔNG phải file .pub."
            exit 1
          fi
          SSH_OPTS="-i $KEY -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "Uploading $SRC -> $VPS_USER@$VPS_HOST:$VPS_PATH/{$VERSION/$BASE, latest/$STABLE_NAME}"
          ssh $SSH_OPTS -p "$PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH/$VERSION' '$VPS_PATH/latest'"
          # Bản lưu trữ theo version
          scp $SSH_OPTS -P "$PORT" "$SRC" "$VPS_USER@$VPS_HOST:$VPS_PATH/$VERSION/$BASE"
          # Bản "latest" cố định (landing luôn trỏ vào đây)
          scp $SSH_OPTS -P "$PORT" "$SRC" "$VPS_USER@$VPS_HOST:$VPS_PATH/latest/$STABLE_NAME"
